# Seer's Resource Zones config. To change a setting, copy it into config.yml in this folder.
# Anything that's not in config.yml uses the default from this file.

# Shown in the action bar while a player is in a resource zone. It takes turns with other mods'
# messages that are kept there (e.g. PropSwap's), and makes way for any other action bar message.
# It can use any of Text Placeholder API's formatting, see:
# https://placeholders.pb4.eu/user/text-format/
notice: "<gold>Resource zone</gold> <gray>- this area is reset regularly</gray>"

# Resource zones are outlined with particles near each player, where they meet chunks that aren't
# in a zone. They're off until a player turns them on with /resourcezones particles.
particles:
  # The particles' colour, as one of Minecraft's colour names (e.g. gold), or hex (e.g. "#FFAA00").
  colour: gold
  # How far away from each player zones are outlined, in blocks (1 to 64), measured horizontally,
  # so the outline follows them around. Larger means more particles, and the game only shows so
  # many at once, so outlines can get patchy if it's set too high.
  radius_blocks: 16

# How editing resource zones (with /resourcezones edit) looks to admins.
edit:
  # Shown in the action bar while editing, in place of the notice. ${mode} is adding, removing, or
  # paused, and ${added} and ${removed} are how many chunks are being added and removed.
  status: "<gold>Editing resource zones</gold> <gray>- ${mode}</gray> <green>+${added}</green> <red>-${removed}</red>"
  # While editing, the middle of each chunk that's in a zone, or being added or removed, is marked
  # with particles. Each kind has its own shape too: chunks being added have a plus on top, and
  # chunks being removed are dashed.
  markers:
    # How far away from each admin chunks are marked, in chunks (1 to 16).
    radius_chunks: 8
    # Each kind of marker's colour, as one of Minecraft's colour names, or hex (e.g. "#5555FF").
    colours:
      # Chunks in a zone, that aren't being changed.
      zone: blue
      added: green
      removed: red

# Each dimension's resource zones are written to a file whenever they change (and when the server
# starts), as an MCA Selector selection, e.g. resource-zones/minecraft/overworld.csv. To reset
# zones, stop the server, then delete the selected chunks with MCA Selector, e.g.:
#   java -jar mcaselector.jar --mode delete --world <world>/dimensions/minecraft/overworld --selection resource-zones/minecraft/overworld.csv
export:
  # The folder the files are written to, relative to the server's folder. It can't be outside the
  # server's folder.
  folder: resource-zones
