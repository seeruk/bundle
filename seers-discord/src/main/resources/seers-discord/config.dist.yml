# Seer's Discord config. To change a setting, copy it into config.yml in this folder. Anything
# that's not in config.yml uses the default from this file.
#
# Discord stays off until both bot_token and channel_id are set. See the mod's README for how to set
# up a bot.

# The bot's token, from your application's Bot page in the Discord developer portal
# (https://discord.com/developers/applications). Keep it secret: anyone with it can use the bot.
bot_token: ""

# The ID of the channel to bridge chat with. To copy it, turn on Developer Mode in Discord's
# advanced settings, then right-click the channel and choose Copy Channel ID.
channel_id: ""

formats:
  # How players' messages are written in Discord, where they're sent as the player, with their
  # name and face. ${message} is the message, with any formatting from the game (e.g. bold) turned
  # into Discord's. ${display_name} is the player's name, as it's shown in chat (e.g. with a
  # nickname). Both can use Discord's formatting, e.g. _italics_.
  discord:
    chat: "${message}"
    emote: "_${display_name} ${message}_"

  # How messages from Discord are shown in game. ${message} is the message, with any formatting
  # from Discord (e.g. bold) turned into the game's. ${display_name} is the sender's name in the
  # bot's server (e.g. their nickname), and ${username} is their Discord username. By default, they
  # look like players' chat, with the name in blue so it's clear they're from Discord, and the
  # username shown when hovering over the name, as names in a server aren't unique. Formats can use
  # the game's formatting tags, e.g. <blue>.
  #
  # In chat, ${reply} is where the reply format goes, if the message is a reply (and nothing if it
  # isn't). The reply format's placeholders are for the message that was replied to. By default,
  # it's a ➥ that shows who and what was replied to when it's hovered over.
  game:
    chat: "${reply}<blue><<hover 'Discord user @${username}'>${display_name}</hover>></blue> ${message}"
    reply: "<gray><hover '${display_name}: ${message}'>➥</hover></gray> "
