# Seer's AFK config. To change a setting, copy it into config.yml in this folder. Anything that's
# not in config.yml uses the default from this file.

# How long a player can go without doing anything before they're marked as AFK, in seconds. Being
# moved by something else (e.g. by water, or a piston) doesn't count as doing something.
timeout_seconds: 300

# The messages shown to everyone when a player goes AFK, or comes back. ${player} is the player's
# name, as it's shown in chat. Any of Text Placeholder API's formatting can be used, see:
# https://placeholders.pb4.eu/user/text-format/
messages:
  afk: "<yellow>${player} is now AFK</yellow>"
  back: "<yellow>${player} is no longer AFK</yellow>"
